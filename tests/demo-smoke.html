<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OSA Phenotyper - Demo Smoke Suite</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #f8f9fa; }
  .pass { color: #198754; } .fail { color: #dc3545; }
  .summary { padding: 1rem; border-radius: 8px; background: #fff; }
  pre { background: #fff; padding: .5rem; border: 1px solid #dee2e6; margin: .25rem 0; }
  iframe { position: absolute; left: -9999px; width: 1440px; height: 2400px; border: 0; }
</style>
</head>
<body>
<h1>Demo Smoke Suite</h1>
<div id="results"></div>
<iframe id="appFrame" src="../index.html?demo=inspire"></iframe>
<iframe id="intakeFrame" src="../intake.html?demo=inspire&amp;t=demo-token"></iframe>
<script>
let passed = 0;
let failed = 0;
const results = [];

function assert(condition, message) {
  if (condition) passed++; else failed++;
  results.push({ pass: Boolean(condition), message });
}

function assertEqual(actual, expected, message) {
  assert(actual === expected, `${message}${actual === expected ? '' : ` (got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)})`}`);
}

function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function waitFor(predicate, label, timeout = 12000) {
  const started = Date.now();
  while (Date.now() - started < timeout) {
    try { const value = predicate(); if (value) return value; } catch (_) {}
    await wait(50);
  }
  throw new Error(`Timed out: ${label}`);
}

function click(win, selector) {
  const element = win.document.querySelector(selector);
  if (!element) throw new Error(`Missing element ${selector}`);
  element.click();
}

async function run() {
  const appFrame = document.getElementById('appFrame');
  await waitFor(() => appFrame.contentWindow?.OSAInspireDemo?.getMainPatientId(), 'synthetic patient seed');
  const appWin = appFrame.contentWindow;
  const appDoc = appFrame.contentDocument;
  appWin.alert = () => {};
  appWin.confirm = () => true;

  assertEqual(appDoc.getElementById('runtimeEnvBadge').textContent.trim(), 'DEMO', 'Demo runtime is unmistakably labeled');
  assert(appDoc.getElementById('runtimeEnvironmentBanner').textContent.toLowerCase().includes('synthetic'), 'Demo explains that all patient data is synthetic and local');
  assert(!!appDoc.getElementById('osaDemoGuide'), 'Demo guide presents the patient, staff, clinician, and report sequence');
  assertEqual(appDoc.getElementById('patientName').value, 'LEE, Morgan', 'Demo opens the primary synthetic patient chart');
  assertEqual(appWin.__OSA_WORKFLOW_TEST__.listPatients(false).length, 2, 'Demo seeds a main journey and a separate safety counterexample');

  click(appWin, '#btnIntakeLink');
  await waitFor(() => appDoc.getElementById('intakeLinkModal').classList.contains('show'), 'questionnaire modal');
  click(appWin, '#btnGenerateIntakeLink');
  await waitFor(() => appDoc.getElementById('intakeLinkValue').value.includes('demo=inspire'), 'demo questionnaire link');
  const questionnaireUrl = new URL(appDoc.getElementById('intakeLinkValue').value);
  assert(questionnaireUrl.searchParams.get('demo') === 'inspire', 'Generated questionnaire link stays in synthetic demo mode');
  assertEqual(questionnaireUrl.origin, appWin.location.origin, 'Demo questionnaire stays on the local app origin');
  assert(!appDoc.getElementById('btnOpenIntakeLink').classList.contains('d-none'), 'Demo can open the real questionnaire directly');
  appWin.bootstrap.Modal.getInstance(appDoc.getElementById('intakeLinkModal')).hide();

  click(appWin, '[data-demo-action="prep"]');
  assertEqual(appWin.OSAWorkspaceView.getMode(), 'prep', 'Demo guide switches to the staff preparation workspace');
  assertEqual(appDoc.querySelector('[name="pahi"]').value, '28', 'Demo chart starts with documented WatchPAT results');
  assert(appDoc.querySelector('[name="ctTurbs"]').checked, 'Demo chart documents turbinate hypertrophy');
  assert(appDoc.querySelector('[name="planInspire"]').checked, 'Demo plan prioritizes nerve-stimulation evaluation');
  assert(!appDoc.querySelector('[name="planNasal"]').checked, 'Demo does not let generic nasal care outrank the Inspire workup');
  assert(!appDoc.querySelector('[name="planWeight"]').checked, 'Demo plan does not promote weight management for this encounter');
  assert(appDoc.querySelector('[name="planSummary"]').value.startsWith('Complete DISE'), 'Demo plan names DISE as the most important next step');
  assert(appDoc.querySelector('[name="planSummary"]').value.includes('turbinate reduction'), 'Demo plan keeps turbinate reduction as a secondary same-anesthetic step');

  const intakeFrame = document.getElementById('intakeFrame');
  await waitFor(() => intakeFrame.contentDocument?.getElementById('stateForm')?.classList.contains('intake-form-view--active'), 'demo questionnaire');
  const intakeWin = intakeFrame.contentWindow;
  const intakeDoc = intakeFrame.contentDocument;
  assert(intakeDoc.getElementById('intakeRuntimeBanner').textContent.includes('browser memory only'), 'Questionnaire explains demo privacy boundary');
  const demoAnswersWerePrefilled = intakeDoc.getElementById('visitReason').value === 'inspire';
  assert(demoAnswersWerePrefilled, 'Demo questionnaire opens with synthetic answers prefilled');
  if (!demoAnswersWerePrefilled) click(intakeWin, '#btnFillDemoAnswers');
  assert(intakeDoc.querySelector('input[name="prefInspire"]').checked, 'Prefilled answers preserve the patient preference signal');
  assert(intakeDoc.getElementById('progressLabel').textContent.includes('8 of 8'), 'Prefilled answers complete every required questionnaire section');
  click(intakeWin, '#submitBtn');
  await waitFor(() => intakeDoc.getElementById('stateThankYou').classList.contains('intake-state--active'), 'demo questionnaire submission');
  const submission = intakeWin.__OSA_INTAKE_WORKFLOW_TEST__.getLastSubmission();
  assertEqual(submission.payload.cpapHistory.retryWilling, 'No', 'Synthetic patient reports CPAP failure without willingness to retry');

  await waitFor(() => appWin.__OSA_WORKFLOW_TEST__.getPatient(appWin.OSAInspireDemo.getMainPatientId()).intakePendingFieldCount > 0, 'intake pending review');
  const submittedPatient = appWin.__OSA_WORKFLOW_TEST__.getPatient(appWin.OSAInspireDemo.getMainPatientId());
  assertEqual(submittedPatient.formData.sex, 'M', 'Demo intake applies patient sex to an empty chart field');
  assertEqual(String(submittedPatient.formData.bmi), '28.6', 'Demo intake preserves the documented BMI');
  assertEqual(appDoc.querySelector('[name="sex"]').value, 'M', 'Submitted patient sex is visible in the clinician form');
  assert(appDoc.querySelector('[name="priorCpap"]').checked, 'Submitted CPAP history is visible in the clinician form');
  assert(appDoc.querySelector('[name="prefInspire"]').checked, 'Submitted treatment preference is visible in the clinician form');
  assertEqual(appWin.OSAWorkspaceView.getMode(), 'prep', 'Submitted questionnaire returns the journey to staff review');
  assert(appDoc.getElementById('osaDemoStatus').textContent.includes('Questionnaire received'), 'Demo guide advances after questionnaire submission');

  click(appWin, '[data-demo-action="counterexample"]');
  await waitFor(() => appDoc.getElementById('patientName').value === 'DEMO, Safety Boundary', 'safety counterexample');
  assertEqual(appDoc.querySelector('[name="vPat"]').value, 'Concentric', 'Safety counterexample carries complete concentric collapse data');
}

function render() {
  const container = document.getElementById('results');
  const summary = document.createElement('div');
  summary.className = 'summary';
  summary.innerHTML = `<strong>${passed} passed</strong>, <strong>${failed} failed</strong>`;
  container.appendChild(summary);
  results.forEach(result => {
    const row = document.createElement('pre');
    row.className = result.pass ? 'pass' : 'fail';
    row.textContent = `${result.pass ? 'PASS' : 'FAIL'}: ${result.message}`;
    container.appendChild(row);
  });
}

(async () => {
  try { await run(); }
  catch (error) { failed++; results.push({ pass: false, message: `Unhandled demo-suite error: ${error.message}` }); }
  render();
})();
</script>
</body>
</html>
