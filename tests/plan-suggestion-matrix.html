function assert(condition, message) {
  if (condition) passed++; else failed++;
  results.push({ pass: Boolean(condition), message });
}
function assertEqual(actual, expected, message) {
  assert(actual === expected, `${message}${actual === expected ? '' : ` (got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)})`}`);
}
function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
async function waitFor(predicate, label, timeout = 12000) {
  const started = Date.now();
  while (Date.now() - started < timeout) {
    try { const value = predicate(); if (value) return value; } catch (_) {}
    await wait(50);
  }
  throw new Error(`Timed out: ${label}`);
}
function setValue(win, name, value) {
  const el = win.document.querySelector(`[name="${name}"]`);
  if (!el) throw new Error(`Missing field ${name}`);
  el.value = value;
  el.dispatchEvent(new win.Event('input', { bubbles: true }));
  el.dispatchEvent(new win.Event('change', { bubbles: true }));
}
function setId(win, id, value) {
  const el = win.document.getElementById(id);
  if (!el) throw new Error(`Missing field ${id}`);
  el.value = value;
  el.dispatchEvent(new win.Event('input', { bubbles: true }));
  el.dispatchEvent(new win.Event('change', { bubbles: true }));
}
function setCheck(win, id, checked = true) {
  const el = win.document.getElementById(id);
  if (!el) throw new Error(`Missing checkbox ${id}`);
  el.checked = checked;
  el.dispatchEvent(new win.Event('change', { bubbles: true }));
}
function textOnly(html, win) {
  const shell = win.document.createElement('div');
  shell.innerHTML = html;
  return shell.textContent.replace(/\s+/g, ' ').trim();
}
function localIsoDate(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

async function runScenario(win, doc, scenario, index) {
  doc.getElementById('form').reset();
  await wait(0);
  setId(win, 'patientName', `SYNTHETIC PLAN ${index + 1}, Test`);
  setId(win, 'patientDob', '1975-01-15');
  setValue(win, 'visitReason', scenario.visitReason);
  Object.entries(scenario.fields).forEach(([name, value]) => setValue(win, name, value));
  scenario.checks.forEach(id => setCheck(win, id));
  win.OSAPlanSuggestions.refresh();
  await waitFor(() => (
    win.OSAPlanSuggestions.derive().length === scenario.expectedSuggestions.length &&
    doc.querySelectorAll('#planSuggestionList .osa-plan-suggestion').length === scenario.expectedSuggestions.length
  ), `${scenario.id} suggestions`);

  const suggestions = win.OSAPlanSuggestions.derive();
  const labels = suggestions.map(item => item.label);
  assertEqual(JSON.stringify(labels), JSON.stringify(scenario.expectedSuggestions), `${scenario.name}: suggested pathways`);
  assert(suggestions.every(item => item.reason && item.reason.length > 10), `${scenario.name}: every suggestion explains why it appeared`);
  assert(scenario.expectedSuggestions.every(label => !doc.querySelector(`[data-plan-option] input:checked`)), `${scenario.name}: suggestions remain unapplied initially`);

  if (suggestions.length) {
    win.OSAPlanSuggestions.apply();
  } else {
    (scenario.manualPlanFields || []).forEach(id => setCheck(win, id));
    setId(win, 'planSummary', scenario.manualSummary || 'Continue clinical evaluation and arrange appropriate follow-up.');
  }
  const draftSummary = doc.getElementById('planSummary').value;
  assert(
    draftSummary.length >= 15 && draftSummary.length <= 240,
    `${scenario.name}: creates a usable editable summary (${draftSummary.length} characters: ${draftSummary})`
  );
  setCheck(win, 'planConfirmed');
  doc.querySelector('#form button[type="submit"]').click();
  const expectedPatientName = `SYNTHETIC PLAN ${index + 1}, Test`;
  const data = await waitFor(() => {
    const latest = win.OSAReportState.getLastAnalysisData();
    return latest?.patientName === expectedPatientName ? latest : null;
  }, `${scenario.id} analysis`);
  const recTags = (data.recTags || []).map(rec => rec.tag);
  scenario.expectedTags.forEach(tag => assert(recTags.includes(tag), `${scenario.name}: clinician output includes ${tag}`));
  assertEqual(data.reportDate, localIsoDate(), `${scenario.name}: report uses the local encounter date`);
  assertEqual(
    JSON.stringify([...data.selectedPlanFields].sort()),
    JSON.stringify((scenario.manualPlanFields || suggestions.map(item => item.field)).sort()),
    `${scenario.name}: confirmed plan matches applied suggestions`
  );

  const patientHtml = win.PatientReport.generateReportHTML(data);
  const patientText = textOnly(patientHtml, win);
  const clinicianText = (doc.getElementById('clinicianReport')?.textContent || '').replace(/\s+/g, ' ').trim();
  assert(clinicianText.length > 100, `${scenario.name}: clinician report is populated`);
  (scenario.clinicianIncludes || []).forEach(phrase => assert(clinicianText.includes(phrase), `${scenario.name}: clinician report includes "${phrase}"`));
  (scenario.clinicianExcludes || []).forEach(phrase => assert(!clinicianText.includes(phrase), `${scenario.name}: clinician report excludes "${phrase}"`));
  scenario.patientIncludes.forEach(phrase => assert(patientText.toLowerCase().includes(phrase.toLowerCase()), `${scenario.name}: patient report includes "${phrase}"`));
  scenario.patientExcludes.forEach(phrase => assert(!patientText.toLowerCase().includes(phrase.toLowerCase()), `${scenario.name}: patient report excludes "${phrase}"`));

  const analysisFlags = {
    selectedNerveStimulationWithoutRecommendation: data.selectedPlanFields.includes('planInspire') &&
      !recTags.some(tag => ['HNS', 'INSPIRE-EVAL', 'INSPIRE-OPT', 'HNS-WORKUP'].includes(tag)),
    missingUarsDiagnosticSuggestion: recTags.includes('UARS-EVAL') && suggestions.length === 0,
    severeHypoxemiaMissingFromDraftSummary: recTags.includes('HB-URG') &&
      !/(oxygen|hypox|urgent|prompt|recheck|follow-up)/i.test(draftSummary),
    limitedStudyStillSuggestsDefinitiveTreatment: scenario.id === 'limited-watchpat' &&
      suggestions.some(item => ['planPap', 'planPositional'].includes(item.field)),
    centralWorkupMissingFromPlanSuggestions: recTags.includes('CENTRAL-PSG-WORKUP') &&
      !suggestions.some(item => item.field === 'planStudy')
  };
  Object.entries(scenario.expectedAnalysisFlags || {}).forEach(([flag, expected]) => {
    assertEqual(analysisFlags[flag], expected, `${scenario.name}: analysis flag ${flag}`);
  });

  captures.push({
    id: scenario.id,
    scenario: scenario.name,
    suggestions: suggestions.map(item => ({ label: item.label, reason: item.reason })),
    draftSummary,
    selectedPlanFields: data.selectedPlanFields,
    recommendationTags: recTags,
    analysisFlags,
    clinicianPlanExcerpt: clinicianText.slice(0, 1200),
    patientReportExcerpt: patientText.slice(0, 1600)
  });
}

async function run() {
  const frame = document.getElementById('appFrame');
  await waitFor(() => frame.contentWindow?.OSAPlanSuggestions && frame.contentWindow?.OSAReportState, 'app ready');
  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  win.alert = () => {};
  win.confirm = () => true;
  await waitFor(() => !doc.getElementById('appContainer').classList.contains('d-none'), 'app visible');

  for (let index = 0; index < SCENARIOS.length; index++) {
    await runScenario(win, doc, SCENARIOS[index], index);
  }
  window.__CAPTURE__ = captures;
  document.getElementById('capture').textContent = JSON.stringify(captures, null, 2);
}

function renderResults() {
  const container = document.getElementById('results');
  const summary = document.createElement('div');
  summary.className = 'summary';
  summary.innerHTML = `<strong>${passed} passed</strong>, <strong>${failed} failed</strong>`;
  container.appendChild(summary);
  results.forEach(result => {
    const pre = document.createElement('pre');
    pre.className = result.pass ? 'pass' : 'fail';
    pre.textContent = `${result.pass ? 'PASS' : 'FAIL'}: ${result.message}`;
    container.appendChild(pre);
  });
}

(async function main() {
  try { await run(); }
  catch (error) { failed++; results.push({ pass: false, message: `Unhandled matrix error: ${error.message}` }); }
  renderResults();
})();
</script>
