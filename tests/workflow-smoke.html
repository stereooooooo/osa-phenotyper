<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OSA Phenotyper – Clinician and Scoped Intake Workflow Smoke Suite</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #f8f9fa; }
  .pass { color: #198754; } .fail { color: #dc3545; }
  .summary { padding: 1rem; border-radius: 8px; background: #fff; }
  pre { background: #fff; padding: .5rem; border: 1px solid #dee2e6; margin: .25rem 0; }
  iframe { position: absolute; left: -9999px; width: 1440px; height: 2400px; border: 0; }
</style>
</head>
<body>
<h1>Clinician and Scoped Intake Workflow Smoke Suite</h1>
<div id="results"></div>
<iframe id="appFrame" src="../index.html?testMode=workflow"></iframe>
<iframe id="intakeFrame" src="../intake.html?testMode=workflow&amp;t=workflow-token"></iframe>
<script>
let passed = 0;
let failed = 0;
const results = [];

function assert(condition, message) {
  if (condition) passed++; else failed++;
  results.push({ pass: Boolean(condition), message });
}

function assertEqual(actual, expected, message) {
  assert(actual === expected, `${message}${actual === expected ? '' : ` (got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)})`}`);
}

function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

async function waitFor(predicate, label, timeout = 12000) {
  const started = Date.now();
  while (Date.now() - started < timeout) {
    try { const value = predicate(); if (value) return value; } catch (_) {}
    await wait(50);
  }
  throw new Error(`Timed out: ${label}`);
}

function setValue(win, selector, value) {
  const el = win.document.querySelector(selector);
  if (!el) throw new Error(`Missing element ${selector}`);
  el.value = value;
  el.dispatchEvent(new win.Event('input', { bubbles: true }));
  el.dispatchEvent(new win.Event('change', { bubbles: true }));
}

function click(win, selector) {
  const el = win.document.querySelector(selector);
  if (!el) throw new Error(`Missing element ${selector}`);
  el.click();
}

function chooseRadio(win, name, value) {
  click(win, `input[name="${name}"][value="${value}"]`);
}

async function run() {
  const frame = document.getElementById('appFrame');
  await waitFor(() => frame.contentDocument && frame.contentDocument.getElementById('appContainer'), 'app frame');
  const win = frame.contentWindow;
  const doc = win.document;
  win.alert = () => {};
  win.confirm = () => true;

  await waitFor(() => !doc.getElementById('appContainer').classList.contains('d-none'), 'app visible');
  assertEqual(doc.getElementById('runtimeEnvBadge').textContent.trim(), 'WORKFLOW TEST', 'Workflow runtime is clearly labeled');
  const dbClientSource = await fetch('../js/db.js').then(response => response.text());
  assert(!dbClientSource.includes('listPatients'), 'Production database client exposes no bulk patient-list method');
  assert(!!doc.getElementById('btnIntakeLink'), 'Patient-specific intake control is available');
  assert(!doc.getElementById('btnPortalLink'), 'Patient portal control is absent');
  assert(!doc.getElementById('btnPublishPatientPortal'), 'Patient portal publishing is absent');

  setValue(win, '#homeNewName', 'Workflow QA Patient');
  setValue(win, '#homeNewDob', '1984-03-12');
  click(win, '#homeCreateBtn');
  await waitFor(() => doc.getElementById('homeOpenChart'), 'home chart creation');
  click(win, '#homeOpenChart');
  await waitFor(() => doc.getElementById('patientName').value === 'Workflow QA Patient', 'home-created chart opens');
  assertEqual(doc.getElementById('patientDob').value, '1984-03-12', 'Home-created chart opens with its identity data');
  assertEqual(doc.querySelector('[name="age"]').value, '42', 'Age is calculated automatically from date of birth');
  setValue(win, '#patientMrn', 'WF-001');
  setValue(win, '[name="visitReason"]', 'new-diagnosis');
  setValue(win, '[name="sex"]', 'M');
  setValue(win, '[name="bmi"]', '32');
  setValue(win, '[name="neck"]', '17');
  setValue(win, '[name="tonsils"]', '2');
  setValue(win, '[name="ftp"]', 'III');
  setValue(win, '[name="pahi"]', '28');
  setValue(win, '[name="tst"]', '6');
  setValue(win, '[name="remPercent"]', '23.1');
  setValue(win, '[name="supPahi"]', '42');
  setValue(win, '[name="nonSupPahi"]', '9');
  setValue(win, '[name="noseScore"]', '60');
  setValue(win, '[name="weightLossReadiness"]', 'considering');
  click(win, '#priorCpap');
  click(win, '#cpapCurrent');
  click(win, '#cpapDry');
  setValue(win, '#papMode', 'APAP');
  setValue(win, '[name="papMinPressure"]', '7');
  setValue(win, '[name="papMaxPressure"]', '15');
  await waitFor(() => doc.querySelectorAll('#planSuggestionList .osa-plan-suggestion').length === 4, 'chart-aware plan suggestions');
  const suggestionText = doc.getElementById('planSuggestionList').textContent;
  assert(suggestionText.includes('PAP management'), 'Current PAP use produces a PAP-management suggestion');
  assert(suggestionText.includes('Nasal treatment'), 'NOSE 60 and dry mouth produce a nasal-treatment suggestion');
  assert(suggestionText.includes('Positional therapy'), 'Supine-predominant data produce a positional-therapy suggestion');
  assert(suggestionText.includes('Weight management'), 'Documented weight-management interest produces a weight suggestion');
  assert(!doc.getElementById('planPap').checked, 'Suggestions do not silently select a treatment pathway');
  assert(!doc.getElementById('planMad').disabled, 'Non-suggested treatment pathways remain available');
  doc.getElementById('planConfirmed').checked = true;
  click(win, '#btnApplyPlanSuggestions');
  assert(!doc.getElementById('planConfirmed').checked, 'Applying a draft requires the clinician to confirm the plan again');
  assert(doc.getElementById('planPap').checked, 'Applying suggestions selects PAP management');
  assert(doc.getElementById('planNasal').checked, 'Applying suggestions selects nasal treatment');
  assert(doc.getElementById('planPositional').checked, 'Applying suggestions selects positional therapy');
  assert(doc.getElementById('planWeight').checked, 'Applying suggestions selects weight management');
  assert(doc.getElementById('planSummary').value.includes('Continue APAP'), 'Applying suggestions drafts the next-step summary');
  assert(doc.getElementById('planSummary').value.includes('prioritize nasal treatment'), 'Draft summary prioritizes nasal treatment for PAP dryness');
  doc.getElementById('planConfirmed').checked = true;
  click(win, '#cvd');
  setValue(win, '#echoHistory', 'yes');
  setValue(win, '#echoResultKnowledge', 'unknown');
  assert(!doc.getElementById('lvefFollowupAlert').classList.contains('d-none'), 'Missing numeric LVEF produces an MA-facing record request');

  click(win, '#btnSavePatient');
  await waitFor(() => doc.getElementById('patientNameDisplay').textContent.trim() === 'Workflow QA Patient', 'chart saved');
  assertEqual(win.__OSA_WORKFLOW_TEST__.listPatients(false).length, 1, 'Chart saves through the clinician UI');
  assert(doc.getElementById('lvefNeededBadge').textContent.includes('LVEF Needed'), 'LVEF follow-up flag persists on the saved chart');
  click(win, '#btnIntakeLink');
  await waitFor(() => doc.getElementById('intakeLinkModal').classList.contains('show'), 'intake link modal');
  assert(doc.getElementById('intakeLinkModal').textContent.includes('Do not sign the clinician workspace'), 'iPad instructions preserve clinician and patient security boundaries');
  click(win, '#btnGenerateIntakeLink');
  await waitFor(() => doc.getElementById('intakeLinkValue').value.includes('/intake.html?t='), 'intake link generated');
  assert(doc.getElementById('intakeLinkValue').value.includes('/intake.html?t='), 'Generated link opens the scoped questionnaire rather than the clinician workspace');
  assert(!doc.getElementById('intakeLinkValue').value.includes('/patients'), 'Generated intake link contains no patient API or roster route');
  win.bootstrap.Modal.getInstance(doc.getElementById('intakeLinkModal')).hide();

  click(win, '#form button[type="submit"]');
  await waitFor(() => win.OSAReportState && win.OSAReportState.getLastAnalysisData(), 'analysis');
  assertEqual(win.OSAReportState.getLastAnalysisData().primaryAHI, 28, 'Clinical analysis still runs');
  await waitFor(() => doc.querySelectorAll('#precisionSleepProfile .precision-profile-row').length === 6, 'precision sleep profile');
  assert(doc.getElementById('precisionSleepProfile').textContent.includes('Qualitative clinical signals'), 'Profile explicitly avoids causal percentages');
  assert(doc.getElementById('precisionSleepProfile').textContent.includes('Weight & metabolic'), 'Profile organizes the assessment into patient-friendly domains');
  click(win, '#btnGenerateReport');
  await waitFor(() => doc.getElementById('reportOverlay').classList.contains('active'), 'report overlay');
  assert(doc.getElementById('reportPreviewContent').textContent.includes('Workflow QA Patient'), 'Patient report preview is generated for clinician distribution');
  assert(doc.getElementById('reportPreviewContent').textContent.includes('Continue APAP'), 'Current APAP use is presented as continuation, not a new start');
  assert(doc.getElementById('reportPreviewContent').textContent.includes('7-15 cm H2O'), 'Patient report preserves the APAP pressure range');
  assert(!doc.getElementById('reportPreviewContent').textContent.includes('Confirm Oral Appliance Safety First'), 'Unselected oral-appliance prerequisites stay out of the patient report');
  assert(!doc.getElementById('reportPreviewContent').textContent.includes('DISE-Guided'), 'Unselected surgical prerequisites stay out of the patient report');
  click(win, '#btnEditReport');
  await waitFor(() => win.OSAReportState.isEditingPreview(), 'patient report edit mode');
  const editableReport = doc.querySelector('#reportPreviewContent .patient-report');
  assertEqual(editableReport.getAttribute('contenteditable'), 'true', 'Clinician can enable direct patient-report editing');
  editableReport.querySelector('.report-title').textContent = 'Clinician Edited Sleep Report';
  editableReport.dispatchEvent(new win.Event('input', { bubbles: true }));
  assert(!doc.getElementById('btnResetReportEdits').disabled, 'Editing enables reset changes');
  click(win, '#btnEditReport');
  assert(!win.OSAReportState.isEditingPreview(), 'Done Editing returns the report to review mode');
  click(win, '#btnSaveReportSnapshot');
  await waitFor(() => win.__OSA_WORKFLOW_TEST__.listPatients(false)[0].reportSnapshotCount === 1, 'snapshot saved');
  assertEqual(win.__OSA_WORKFLOW_TEST__.listPatients(false)[0].reportSnapshotCount, 1, 'Report snapshot stays in the chart');
  const savedSnapshot = win.__OSA_WORKFLOW_TEST__.listPatients(false)[0].reportSnapshots[0];
  assert(savedSnapshot.patientReportHtml.includes('Clinician Edited Sleep Report'), 'Saved snapshot preserves clinician report edits');
  assert(!savedSnapshot.patientReportHtml.includes('contenteditable='), 'Saved snapshot strips edit-mode attributes');
  click(win, '#btnCloseReport');

  click(win, '#btnFollowups');
  await waitFor(() => doc.getElementById('followupModal').classList.contains('show'), 'follow-up modal');
  setValue(win, '#followupTreatment', 'PAP');
  setValue(win, '#followupStatus', 'Active');
  setValue(win, '#followupResponse', 'Better');
  setValue(win, '#followupAdherence', 'Using as planned');
  setValue(win, '#followupNextAction', 'Continue current plan');
  setValue(win, '#followupEss', '7');
  click(win, '#btnSaveFollowup');
  await waitFor(() => win.__OSA_WORKFLOW_TEST__.listPatients(false)[0].followupCount === 1, 'follow-up saved');
  const followup = win.__OSA_WORKFLOW_TEST__.listPatients(false)[0].followups[0];
  assertEqual(followup.treatment, 'PAP', 'Structured follow-up stores the active treatment pathway');
  assertEqual(followup.ess, 7, 'Structured follow-up stores optional outcome measures');
  await waitFor(() => doc.getElementById('followupHistory').textContent.includes('Continue current plan'), 'follow-up history rendered');
  assert(doc.getElementById('followupHistory').textContent.includes('Continue current plan'), 'Saved follow-up immediately appears in longitudinal history');
  win.bootstrap.Modal.getInstance(doc.getElementById('followupModal')).hide();

  click(win, '#btnClearForm');
  click(win, '#btnPatientList');
  await waitFor(() => doc.getElementById('patientListModal').classList.contains('show'), 'find patient modal');
  assertEqual(doc.querySelectorAll('#patientListBody tr').length, 0, 'Opening Find Patient does not expose a bulk roster');
  assert(doc.getElementById('patientListEmpty').textContent.includes('Results are limited to 10'), 'Search UI states its bounded result limit');

  setValue(win, '#patientSearch', 'Workflow QA Patient');
  await waitFor(() => doc.querySelectorAll('#patientListBody tr').length === 1, 'name search');
  assert(doc.querySelector('#patientListBody tr').textContent.includes('Workflow QA Patient'), 'Exact-name search returns the matching chart');
  assert(doc.querySelector('#patientListBody tr').textContent.includes('LVEF Needed'), 'Bounded search surfaces the unresolved echo/LVEF flag');
  doc.querySelector('#patientListBody tr').click();
  await waitFor(() => doc.getElementById('patientName').value === 'Workflow QA Patient', 'chart loaded');
  assertEqual(doc.getElementById('patientDob').value, '1984-03-12', 'Selected chart rehydrates identity fields');
  assertEqual(doc.querySelector('[name="remPercent"]').value, '23.1', 'Imported REM percentage persists when the chart is reopened');
  setValue(win, '#lvef', '55');
  await waitFor(() => !doc.getElementById('btnSavePatient').disabled, 'save button ready for LVEF resolution');
  click(win, '#btnSavePatient');
  await waitFor(() => doc.getElementById('lvefNeededBadge').classList.contains('d-none'), 'LVEF follow-up resolved');
  assert(doc.getElementById('lvefFollowupAlert').classList.contains('d-none'), 'Documenting numeric LVEF clears the MA record request');

  click(win, '#btnPatientList');
  setValue(win, '#patientSearch', '1984-03-12');
  await waitFor(() => doc.querySelectorAll('#patientListBody tr').length === 1, 'DOB search');
  assert(doc.querySelector('#patientListBody tr').textContent.includes('1984-03-12'), 'DOB search returns the matching chart');

  const patientId = win.__OSA_WORKFLOW_TEST__.listPatients(false)[0].patientId;
  click(win, '#patientListBody .btn-delete-patient');
  await waitFor(() => win.__OSA_WORKFLOW_TEST__.getPatient(patientId).isDeleted, 'archive');
  assert(win.__OSA_WORKFLOW_TEST__.getPatient(patientId).isDeleted, 'Admin can archive a chart');
  click(win, '#toggleArchivedPatients');
  await waitFor(() => doc.querySelector('#patientListBody .btn-restore-patient'), 'archived search result');
  click(win, '#patientListBody .btn-restore-patient');
  await waitFor(() => !win.__OSA_WORKFLOW_TEST__.getPatient(patientId).isDeleted, 'restore');
  assert(!win.__OSA_WORKFLOW_TEST__.getPatient(patientId).isDeleted, 'Admin can restore an archived chart');

  const intakeFrame = document.getElementById('intakeFrame');
  await waitFor(() => intakeFrame.contentDocument?.getElementById('stateForm')?.classList.contains('intake-form-view--active'), 'patient intake form');
  const intakeWin = intakeFrame.contentWindow;
  const intakeDoc = intakeFrame.contentDocument;
  setValue(intakeWin, '#sex', 'F');
  setValue(intakeWin, '#heightFeet', '5');
  setValue(intakeWin, '#heightInches', '6');
  setValue(intakeWin, '#weight', '186');
  for (let i = 1; i <= 8; i++) chooseRadio(intakeWin, `ess${i}`, '1');
  for (let i = 1; i <= 7; i++) chooseRadio(intakeWin, `isi${i}`, '1');
  for (let i = 1; i <= 5; i++) chooseRadio(intakeWin, `nose${i}`, '1');
  chooseRadio(intakeWin, 'nasalObs', 'yes');
  chooseRadio(intakeWin, 'snoringReported', 'yes');
  assert(intakeDoc.querySelector('[data-section="5"] .intake-question__text').textContent.includes('loud, frequent, or bothersome'), 'Snoring question distinguishes clinically relevant snoring from occasional snoring');
  assert(!!intakeDoc.querySelector('#alcoholNearBed option[value="social-only"]'), 'Alcohol choices include occasional or social-event use');

  chooseRadio(intakeWin, 'priorSleepStudy', 'yes');
  assert(intakeDoc.getElementById('sleepStudyDetails').classList.contains('intake-conditional--visible'), 'Prior sleep study answer reveals only the relevant study details');
  setValue(intakeWin, '#sleepStudyYear', '2022');
  chooseRadio(intakeWin, 'priorStudyType', 'home');

  click(intakeWin, 'input[name="priorTx"][value="cpap"]');
  click(intakeWin, 'input[name="priorTx"][value="mad"]');
  click(intakeWin, 'input[name="priorTx"][value="nasal-surgery"]');
  click(intakeWin, 'input[name="priorTx"][value="inspire"]');
  chooseRadio(intakeWin, 'cpapCurrent', 'yes');
  assert(intakeDoc.getElementById('papDeviceTypeGroup').classList.contains('intake-conditional--visible'), 'Current PAP use asks which machine type is used');
  assert(!intakeDoc.getElementById('cpapIssuesGroup').classList.contains('intake-conditional--visible'), 'PAP problem checklist stays hidden until the patient reports difficulty');
  chooseRadio(intakeWin, 'papDeviceType', 'bipap');
  chooseRadio(intakeWin, 'cpapImproved', 'yes');
  chooseRadio(intakeWin, 'cpapDifficulty', 'no');
  assert(!intakeDoc.getElementById('cpapIssuesGroup').classList.contains('intake-conditional--visible'), 'Comfortable current PAP users are not shown an irrelevant problem checklist');
  chooseRadio(intakeWin, 'madHelped', 'no');
  chooseRadio(intakeWin, 'madTolerated', 'no');
  assert(intakeDoc.getElementById('madProblemsGroup').classList.contains('intake-conditional--visible'), 'Oral appliance intolerance reveals specific dental and TMJ barriers');
  click(intakeWin, 'input[name="madProblem"][value="tmj"]');
  chooseRadio(intakeWin, 'nasalSurgeryHelped', 'yes');
  chooseRadio(intakeWin, 'hgnsHelped', 'yes');
  setValue(intakeWin, '#hgnsImplantYear', '2024');

  chooseRadio(intakeWin, 'cvdHistory', 'yes');
  chooseRadio(intakeWin, 'chronicOpioidUse', 'no');
  chooseRadio(intakeWin, 'neuromuscularRespiratoryRisk', 'no');
  chooseRadio(intakeWin, 'hypoventilationRisk', 'no');
  assert(intakeDoc.getElementById('echoHistoryDetails').classList.contains('intake-conditional--visible'), 'Cardiovascular history opens the echocardiogram question');
  click(intakeWin, 'input[name="cvdCondition"][value="hypertension"]');
  chooseRadio(intakeWin, 'echoHistory', 'yes');
  chooseRadio(intakeWin, 'echoResultKnowledge', 'unknown');
  chooseRadio(intakeWin, 'weightInterest', 'ready');
  chooseRadio(intakeWin, 'glp1Status', 'previous');
  assert(intakeDoc.getElementById('glp1Details').classList.contains('intake-conditional--visible'), 'Prior GLP-1 use reveals medication, benefit, and problem questions');
  setValue(intakeWin, '#glp1Medication', 'semaglutide');
  chooseRadio(intakeWin, 'glp1Effective', 'yes');
  click(intakeWin, 'input[name="glp1Issue"][value="digestive"]');
  click(intakeWin, '#submitBtn');
  await waitFor(() => intakeDoc.getElementById('stateThankYou').classList.contains('intake-state--active'), 'patient intake submitted');
  const intakeSubmission = intakeWin.__OSA_INTAKE_WORKFLOW_TEST__.getLastSubmission();
  assert(intakeSubmission.payload.cardiovascularHistory.hasCvd, 'Intake records cardiovascular disease history');
  assertEqual(intakeSubmission.payload.cardiovascularHistory.echoHistory, 'yes', 'Intake records prior echocardiogram');
  assertEqual(intakeSubmission.payload.cardiovascularHistory.resultKnowledge, 'unknown', 'Intake accepts an unknown echo result without asking the patient to guess LVEF');
  assert(intakeSubmission.payload.cardiovascularHistory.conditions.includes('hypertension'), 'Intake distinguishes hypertension from heart failure and other cardiovascular disease');
  assertEqual(intakeSubmission.payload.sleepTestingRisks.chronicOpioidUse, 'no', 'Intake records chronic opioid screening for sleep-study selection');
  assertEqual(intakeSubmission.payload.sleepTestingRisks.neuromuscularRespiratoryRisk, 'no', 'Intake records neuromuscular respiratory-risk screening');
  assertEqual(intakeSubmission.payload.sleepTestingRisks.hypoventilationRisk, 'no', 'Intake records hypoventilation screening');
  assertEqual(intakeSubmission.payload.sleepStudyHistory.studyType, 'home', 'Intake records prior home versus lab sleep study');
  assertEqual(intakeSubmission.payload.cpapHistory.deviceType, 'bipap', 'Intake records CPAP versus BiPAP without asking for pressure settings');
  assertEqual(intakeSubmission.payload.cpapHistory.hasDifficulty, 'no', 'Intake records whether a current PAP user has difficulty before asking for specific problems');
  assertEqual(intakeSubmission.payload.treatmentOutcomes.mad.tolerated, 'no', 'Intake records oral appliance tolerance');
  assert(intakeSubmission.payload.treatmentOutcomes.mad.problems.includes('tmj'), 'Intake records the reason an oral appliance was not tolerated');
  assertEqual(intakeSubmission.payload.treatmentOutcomes.surgeries['nasal-surgery'], 'yes', 'Intake records whether nasal surgery helped sleep or snoring');
  assertEqual(intakeSubmission.payload.treatmentOutcomes.hgns.implantYear, 2024, 'Intake records nerve stimulator implant year');
  assertEqual(intakeSubmission.payload.glp1History.medication, 'semaglutide', 'Intake records current or prior GLP-1 treatment details');
  assert(intakeSubmission.payload.glp1History.issues.includes('digestive'), 'Intake records GLP-1 problems without requiring free text');
  assert(!Object.prototype.hasOwnProperty.call(intakeSubmission.payload.cpapHistory, 'pressure'), 'Patient intake no longer asks for PAP pressure settings');
  assert(!Object.prototype.hasOwnProperty.call(intakeSubmission.payload, 'age'), 'Patient intake does not ask for age that is already derived from chart DOB');
  assertEqual(intakeDoc.getElementById('weight').value, '', 'Submitted responses are cleared from the handed iPad');
  assert(!intakeWin.location.search.includes('t='), 'Used intake token is removed from the iPad address bar');
}

function render() {
  const container = document.getElementById('results');
  const summary = document.createElement('div');
  summary.className = 'summary';
  summary.innerHTML = `<strong>${passed} passed</strong>, <strong>${failed} failed</strong>`;
  container.appendChild(summary);
  results.forEach(result => {
    const row = document.createElement('pre');
    row.className = result.pass ? 'pass' : 'fail';
    row.textContent = `${result.pass ? 'PASS' : 'FAIL'}: ${result.message}`;
    container.appendChild(row);
  });
}

(async () => {
  try { await run(); }
  catch (err) { failed++; results.push({ pass: false, message: `Unhandled smoke-suite error: ${err.message}` }); }
  render();
})();
</script>
</body>
</html>
